<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hug Day – Only For Anjali</title>

<style>
/* --- Global Styles --- */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body {
  background: url('bg-hug.jpeg') no-repeat center center fixed;
  background-size: cover;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  position:relative;
  text-align:center;
}
body::before {
  content:"";
  position:absolute; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.6); /* darker cinematic overlay */
  z-index:-1;
}

/* --- Screens --- */
.screen {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  transition:opacity 1s ease;
}
.hidden { opacity:0; pointer-events:none; transform:scale(0.95); transition:opacity 0.8s, transform 0.8s; }

/* --- Text & Titles --- */
h1 {
  font-size:3em;
  background: linear-gradient(45deg,#ff66cc,#ff1493);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  from { text-shadow:0 0 10px #ff1493; }
  to { text-shadow:0 0 30px #ff66cc; }
}

/* --- Inputs & Buttons --- */
input {
  padding:12px 25px;
  border-radius:50px;
  border:none;
  outline:none;
  font-size:1.1em;
  margin-top:20px;
  width:250px;
  text-align:center;
}
button {
  padding:12px 30px;
  margin:15px;
  border:none;
  border-radius:50px;
  font-size:1em;
  cursor:pointer;
  background: linear-gradient(45deg,#ff007f,#ff4da6);
  color:white;
  transition: transform 0.3s;
}
button:hover { transform:scale(1.1); }

/* --- Floating Love Messages --- */
.floating {
  position:absolute;
  font-size:20px;
  color:#ff99cc;
  opacity:0.8;
  animation: float linear infinite;
}
@keyframes float {
  from { transform:translateY(100vh); opacity:0; }
  50% { opacity:1; }
  to { transform:translateY(-10vh); opacity:0; }
}

/* --- Hug Scene --- */
#hugScene::before {
  content:"";
  position:absolute; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.4);
  z-index:-1;
}
#clock {
  position:absolute;
  top:20px;
  font-size:1em;
  letter-spacing:1px;
  color:#ff99cc;
}
#passionText {
  max-width:800px;
  font-size:1.2em;
  line-height:2;
  white-space:pre-line;
  text-align:left;
  margin:40px auto;
}
#growingEmoji {
  font-size:40px;
  transition: transform 0.3s ease;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse { from { transform:scale(1); } to { transform:scale(1.3); } }

/* --- Responsive --- */
@media (max-width:768px) {
  h1 { font-size:2em; }
  input { width:200px; font-size:1em; }
  #passionText { font-size:1em; line-height:1.7; }
}
</style>
</head>
<body>

<!-- --- Screens --- -->
<div id="nameScreen" class="screen">
  <h1>Enter Your Name</h1>
  <input type="text" id="nameInput" placeholder="Type your name...">
  <button onclick="checkName()">Enter</button>
</div>

<div id="rejectScreen" class="screen hidden">
  <h1>This place belongs to only one girl.</h1>
</div>

<div id="welcomeScreen" class="screen hidden">
  <h1>Welcome Anjali ❤️</h1>
  <div id="loveMessages"></div>
  <button onclick="askHug()">Continue</button>
</div>

<div id="askScreen" class="screen hidden">
  <h1>Do you want a hug? 🤍</h1>
  <button onclick="startHug()">Yes</button>
  <button onclick="goBack()">No</button>
</div>

<div id="hugScene" class="screen hidden">
  <h1 id="clock"></h1>
  <div id="passionText"></div>
  <div id="growingEmoji">❤️</div>
  <button onclick="location.reload()">Exit</button>
</div>

<!-- --- Music --- -->
<audio id="bgMusic" loop>
  <source src="bg-hug.mp3" type="audio/mpeg">
</audio>

<script>
let musicStarted = false;

/* --- Name Check --- */
function checkName(){
  let name = document.getElementById("nameInput").value.trim().toLowerCase();
  let music = document.getElementById("bgMusic");

  if(name === "anjali"){
    if(!musicStarted){
      music.volume = 0;
      music.play();
      musicStarted = true;
      let fade = setInterval(()=>{
        if(music.volume < 0.8) music.volume += 0.05;
        else clearInterval(fade);
      },200);
    }

    toggleScreen("nameScreen","welcomeScreen");
    createLove();
  } else {
    toggleScreen("nameScreen","rejectScreen");
  }
}

/* --- Auto trigger on typing --- */
document.getElementById("nameInput").addEventListener("input", function(){
  if(this.value.trim().toLowerCase() === "anjali"){
    checkName();
  }
});

/* --- Floating Love Messages --- */
function createLove(){
  let container = document.getElementById("loveMessages");
  let messages = ["You are my peace 🌸","My forever ❤️","My safest place 🤍","My heartbeat 💓","Only you 💞"];
  for(let i=0;i<30;i++){
    let span = document.createElement("div");
    span.className="floating";
    span.style.left = Math.random()*100+"vw";
    span.style.animationDuration = 5+Math.random()*5+"s";
    span.innerText = messages[Math.floor(Math.random()*messages.length)];
    container.appendChild(span);
  }
}

/* --- Ask Hug --- */
function askHug(){ toggleScreen("welcomeScreen","askScreen"); }
function goBack(){ toggleScreen("askScreen","welcomeScreen"); }

/* --- Hug Scene --- */
function startHug(){
  toggleScreen("askScreen","hugScene");
  startClock();

  let text = `
Anjali…

At this moment… I am holding you.

Not casually. Not lightly. But with intention.

My arms wrap around you, pulling you close… until no distance remains.

Feel that warmth? That steady pressure on your back? That’s not just passion—it’s protection.

My heartbeat syncs with yours… slow, deep, certain.

My fingers trace your spine… memorizing, calming you.

You soften into me, and I tighten my embrace—not to trap you, but to show you are chosen.

I lower my head near yours. Close enough to whisper without words.

If the world vanished now… I’d still be complete. Because you are here.

In this hug, there is healing. Safety. Devotion.

Let worries melt. Fears dissolve.

Stay here.

Feel how deeply you are wanted, fiercely protected, completely loved.

And I am not letting go.
`;
  typeWriterSmooth(text);
}

/* --- Smooth Typewriter --- */
function typeWriterSmooth(text){
  const container = document.getElementById("passionText");
  const emoji = document.getElementById("growingEmoji");
  container.innerHTML = "";
  const lines = text.split('\n');
  let lineIndex=0, charIndex=0;

  function draw(){
    if(lineIndex >= lines.length) return;
    let line = lines[lineIndex];

    if(charIndex < line.length){
      container.appendChild(document.createTextNode(line[charIndex]));
      charIndex++;
    } else {
      container.appendChild(document.createElement("br"));
      lineIndex++;
      charIndex=0;
    }

    let totalChars = text.replace(/\n/g,'').length;
    let typedChars = lines.slice(0,lineIndex).join('').length + charIndex;
    let scale = 1 + Math.min((typedChars/totalChars)*1.5,2);
    emoji.style.transform = `scale(${scale})`;

    if(lineIndex<lines.length) setTimeout(draw,30); // smooth typing speed
  }
  draw();
}

/* --- Live Clock --- */
function startClock(){
  function updateClock(){
    let now = new Date();
    document.getElementById("clock").innerText = "This moment with you: " + now.toLocaleTimeString();
  }
  updateClock();
  setInterval(updateClock,1000);
}

/* --- Utility --- */
function toggleScreen(hideId, showId){
  document.getElementById(hideId).classList.add("hidden");
  document.getElementById(showId).classList.remove("hidden");
}
</script>
</body>
</html>
