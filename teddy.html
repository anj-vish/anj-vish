<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Teddy Day Anjali 🧸</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:radial-gradient(circle at top,#1a000d,#000);
  font-family: 'Poppins',
               system-ui,
               -apple-system,
               BlinkMacSystemFont,
               "Segoe UI Emoji",
               "Apple Color Emoji",
               "Noto Color Emoji",
               sans-serif;
  height:100vh;
  overflow:hidden;
  color:#5a2a3c;
}

/* HERO SYSTEM */
.hero{
  position:fixed;
  inset:0;
  z-index:-1;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;        /* fill screen */
  object-position:center;
  filter: brightness(.9) saturate(1.1);
}

@media (max-width: 600px){
  .hero img{
    object-position: 50% 30%;   /* keep faces higher */
  }
}

/* floating hearts */
.heart{
  position:absolute;
  bottom:-30px;
  font-size:22px;
  animation:float 10s linear forwards;
  opacity:.8;
}
@keyframes float{
  to{transform:translateY(-120vh);opacity:0}
}

/* teddy rain */
.teddy{
  position:absolute;
  font-size:42px;
  animation:fall 6s linear forwards;
}
@keyframes fall{
  to{transform:translateY(120vh) rotate(360deg)}
}

#app{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  position:relative;
  z-index:2;
}

.card{
  background:rgba(255,255,255,.92);
  backdrop-filter: blur(6px);
  border-radius:24px;
  padding:40px 30px;
  max-width:700px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  animation:fade 1.5s;
}
@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

h1{
  font-family:'Pacifico',cursive;
  font-size:42px;
  margin-bottom:20px;
}

p{
  font-size:18px;
  line-height:1.7;
  margin-bottom:25px;
}

button{
  background:linear-gradient(135deg,#ff5fa2,#ff9ac7);
  border:none;
  color:white;
  padding:14px 26px;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  margin:8px;
  transition:.3s;
  box-shadow:0 8px 20px rgba(255,90,150,.4);
}
button:hover{transform:scale(1.07)}

.back{
  background:#fff;
  color:#ff5fa2;
  border:2px solid #ff5fa2;
  box-shadow:none;
}
</style>
</head>

<body>

<audio id="bgm" loop>
  <source src="teddymusic.mp3" type="audio/mpeg">
</audio>

<div class="hero">
  <img src="bg-teddy.png" alt="Happy Teddy Day">
</div>

<div id="app"></div>

<script>
const scenes=[
{
title:"Happy Teddy Day Ms. Anjali 🐻",
text:`I wish I could give you a real teddy today…<br><br>
So I made you a digital one instead 😄<br><br>
Just for you.`,
},
{
title:"Your Teddy From Me",
text:`This teddy comes with:<br>
Unlimited hugs 🤍<br>
Free smiles 😊<br>
And one boy who thinks about you a lot.`,
},
{
title:"Small Question",
text:`If I were actually standing in front of you right now…<br><br>
What would you do?`,
choices:["Hug you","Take the teddy"]
},
{
title:"Both Are Cute 😌",
text:`Either way, I’d pretend to act normal…<br>
But inside I’d be very happy.`,
},
{
title:"Just So You Know",
text:`You make ordinary days feel nicer.<br><br>
And special days feel even more special.`,
},
{
title:"One Last Thing 💖",
text:`This teddy is officially yours now 🧸<br><br>
Whenever you see a teddy,<br>
remember someone is sending you a hug.`,
final:true
}
];

let index=0;
const app=document.getElementById("app");

function render(){
  const s=scenes[index];
  app.innerHTML=`
    <div class="card">
      <h1>${s.title}</h1>
      <p>${s.text}</p>
      <div>
        ${index>0?'<button class="back" onclick="back()">Back</button>':''}
        ${s.choices ? 
          s.choices.map(c=>`<button onclick="choose()">${c}</button>`).join("")
          :
          s.final 
          ? `<button onclick="sendHug()">Send Hug 💌</button>`
          : '<button onclick="next()">Continue</button>'
        }
      </div>
    </div>
  `;
  teddyBurst(10);
}

function next(){
  if(index===0){
    document.getElementById("bgm").play();
  }
  index++;
  render();
}

function back(){
  index--;
  render();
}

function choose(){
  teddyBurst(25);
  next();
}

function sendHug(){
  teddyBurst(50);
  window.open("https://wa.me/?text=I just received the cutest teddy hug 🧸💖");
}

render();

/* floating hearts */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerText=["💖","💕","💗","🤍"][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},600);

/* teddy burst */
function teddyBurst(n){
  for(let i=0;i<n;i++){
    const t=document.createElement("div");
    t.className="teddy";
    t.innerText="🧸";
    t.style.left=Math.random()*100+"vw";
    t.style.top="-40px";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),6000);
  }
}
</script>

</body>
</html>
